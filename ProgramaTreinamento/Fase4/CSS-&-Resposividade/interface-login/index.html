<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07 - Interface de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu">
        <div class="logo">
            <img src="assets/logo.png" alt="">
        </div>
        <div class="config email">
            <input type="text" placeholder="e-mail">
        </div>
        <div class="config password">
            <input type="password" placeholder="password">
        </div>
        <div class="button">
            Fazer login
        </div>
        <p class="sign">Ainda não tem uma conta? <span>Cadastre-se agora!</span></p>
    </div>
</body>
</html>
